name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "MinhaIPTV_Android.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extrair o projeto
        run: |
          mkdir projeto
          unzip -q MinhaIPTV_Android.zip -d projeto

      - name: Compilar APK
        working-directory: projeto/MinhaIPTV_Android
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Max-Plus-TV-debug
          path: projeto/MinhaIPTV_Android/app/build/outputs/apk/debug/app-debug.apk
